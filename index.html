<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hendry Wijaya - Apps</title>
<style>
  :root { --bg: #ffffff; --text: #111214; --muted: #5f636a; --mint: #00a844; --card: #f4f5f6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #f2f3f5; --muted: #a6aab0; --mint: #00c853; --card: #141516; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .app { background: var(--card); border-radius: 20px; padding: 20px; margin-top: 28px; }
  .app h2 { margin: 0 0 4px; font-size: 20px; }
  a { color: var(--mint); }
</style>
</head>
<body>
<main>
  <h1>Hendry Wijaya</h1>
  <p class="muted">Android apps</p>

  <section class="app">
    <h2>LEGA - Chat Cleaner</h2>
    <p>Free up space. Keep your chats. Preview before you delete.</p>
    <p><a href="https://wijh7.github.io/lega-privacy/">Privacy policy</a></p>
  </section>

  <p class="muted" style="margin-top:32px">Support: <a href="mailto:support.wijh7@gmail.com">support.wijh7@gmail.com</a></p>
</main>
</body>
</html>
